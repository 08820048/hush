name: Release

# Builds and publishes a release when a version tag is pushed:
#
#   scripts/bump-version.sh 0.2.0
#   git commit -am "chore: release v0.2.0"
#   git tag v0.2.0
#   git push origin main v0.2.0
#
# Tags with a suffix (v0.2.0-beta.1) become pre-releases.
# "Run workflow" on the Actions tab builds a version without publishing it (a dry run).
#
# Signing (optional): with these repository secrets the app and CLI are signed with Developer ID,
# notarized and stapled, so macOS opens them without warnings. Without them the release is built
# ad-hoc and the notes explain how to open it. scripts/setup-signing-secrets.sh sets them.
#   DEVELOPER_ID_P12          base64 of the "Developer ID Application" certificate + key (.p12)
#   DEVELOPER_ID_P12_PASSWORD password of that .p12
#   DEVELOPER_ID              "Developer ID Application: Name (TEAMID)"
#   TEAM_ID                   10-character team ID
#   NOTARY_KEY_P8             base64 of an App Store Connect API key (.p8)
#   NOTARY_KEY_ID / NOTARY_ISSUER   that key's ID and issuer ID
#
# Optional: set the HOMEBREW_TAP_TOKEN secret (a token with write access to
# 08820048/homebrew-tap) to update the Homebrew tap after each stable release.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build without publishing, e.g. 0.2.0 (must match the code)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAP_REPO: 08820048/homebrew-tap

jobs:
  build:
    name: Build
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$VERSION' is not a version like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          case "$VERSION" in *-*) PRERELEASE=true ;; *) PRERELEASE=false ;; esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (pre-release: $PRERELEASE)"

      - name: Check the code carries this version
        run: |
          if ! scripts/check-version.sh "${{ steps.version.outputs.version }}"; then
            echo "::error::The tag does not match the version in the code. Run scripts/bump-version.sh ${{ steps.version.outputs.version }}, commit, and tag again."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing certificate
        id: signing
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          if [ -z "$P12" ] || [ -z "$NOTARY_KEY_P8" ]; then
            echo "No signing secrets: building an ad-hoc release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Word splitting is intended: append the existing keychains to the search list.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Test, build, sign and notarize
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          DEVELOPER_ID: ${{ steps.signing.outputs.signed == 'true' && secrets.DEVELOPER_ID || '' }}
          TEAM_ID: ${{ steps.signing.outputs.signed == 'true' && secrets.TEAM_ID || '' }}
          NOTARY_KEY_PATH: ${{ steps.signing.outputs.signed == 'true' && format('{0}/AuthKey.p8', runner.temp) || '' }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: scripts/release.sh "${{ steps.version.outputs.version }}"

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.signed == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: hush-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, for the changelog

      - uses: actions/download-artifact@v8
        with:
          name: hush-${{ needs.build.outputs.version }}
          path: dist

      - name: Write release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREVIOUS" ]; then
            RANGE="$PREVIOUS..$GITHUB_REF_NAME"
            COMPARE="**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS...$GITHUB_REF_NAME"
          else
            RANGE="$GITHUB_REF_NAME"
            COMPARE=""
          fi
          CHANGES=$(git log "$RANGE" --no-merges --pretty='- %s (%h)' | grep -v 'chore: release v' || true)

          {
            echo "## Changes"
            echo
            echo "${CHANGES:-- No changes listed.}"
            echo
            [ -n "$COMPARE" ] && { echo "$COMPARE"; echo; }
            cat <<EOF
          ## Download

          | File | What it is |
          |---|---|
          | \`Hush-$VERSION.zip\` | The menu bar app. Apple silicon and Intel, macOS 14 or later. |
          | \`hush-cli-$VERSION.zip\` | The \`hush\` command-line tool. |
          | \`SHA256SUMS.txt\` | Checksums. Verify with \`shasum -a 256 -c SHA256SUMS.txt\`. |

          EOF
            if [ "$SIGNED" = "true" ]; then
              cat <<EOF
          ## Installing

          Unzip and move **Hush.app** to Applications, then open it. The app and the CLI are signed with Apple Developer ID and notarized by Apple, so macOS opens them without warnings.

          To install the CLI: unzip, then \`mv hush /usr/local/bin/\` (or anywhere on your PATH).

          ## Updating

          Hush never goes online, so it does not update itself. Quit Hush and replace Hush.app in Applications with the new one; settings and presets are kept. **Check for Updates…** in the menu opens this page. With Homebrew: \`brew upgrade --cask hush\`.

          ## 安装

          解压后把 **Hush.app** 移到"应用程序"文件夹,直接打开即可。App 与命令行工具都已使用 Apple Developer ID 签名并经过 Apple 公证,macOS 不会拦截。

          **更新:** Hush 从不联网,不会自动更新。退出 Hush,用新版本替换"应用程序"中的 Hush.app 即可,设置和预设都会保留。菜单中的"检查更新…"会打开本页面。Homebrew 用户运行 \`brew upgrade --cask hush\`。
          EOF
            else
              cat <<EOF
          ## Opening the app (not signed yet)

          Hush is a free, open-source project and these builds are not signed with an Apple Developer ID yet, so macOS blocks the first launch.

          1. Unzip and move **Hush.app** to Applications.
          2. Open it once. When macOS says it cannot verify the developer, click **Done**.
          3. Open **System Settings › Privacy & Security**, scroll down and click **Open Anyway** next to Hush.

          Or, in Terminal: \`xattr -dr com.apple.quarantine /Applications/Hush.app\`

          To install the CLI: unzip, then \`mv hush /usr/local/bin/\` (or anywhere on your PATH). The same \`xattr\` command applies if macOS blocks it.

          ## Updating

          Hush never goes online, so it does not update itself. Quit Hush and replace Hush.app in Applications with the new one; settings and presets are kept. **Check for Updates…** in the menu opens this page. With Homebrew: \`brew upgrade --cask hush\`.

          ## 打开方式(尚未签名)

          Hush 是免费的开源项目,目前的版本还没有用 Apple 开发者证书签名,所以 macOS 会拦截第一次打开。

          1. 解压后把 **Hush.app** 移到"应用程序"文件夹。
          2. 打开一次。macOS 提示无法验证开发者时,点"完成"。
          3. 打开"系统设置 › 隐私与安全性",在页面下方点击 Hush 旁边的"仍要打开"。

          也可以在终端运行:\`xattr -dr com.apple.quarantine /Applications/Hush.app\`

          **更新:** Hush 从不联网,不会自动更新。退出 Hush,用新版本替换"应用程序"中的 Hush.app 即可,设置和预设都会保留。菜单中的"检查更新…"会打开本页面。Homebrew 用户运行 \`brew upgrade --cask hush\`。
          EOF
            fi
          } > notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          FLAGS=""
          [ "$PRERELEASE" = "true" ] && FLAGS="--prerelease"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Re-running the workflow for the same tag replaces the files and notes.
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Hush $VERSION" --notes-file notes.md $FLAGS
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
              --title "Hush $VERSION" --notes-file notes.md --verify-tag $FLAGS
          fi

  website:
    name: Update website
    needs: publish
    uses: ./.github/workflows/website.yml
    secrets: inherit

  homebrew:
    name: Update Homebrew tap
    needs: [build, publish]
    if: github.event_name == 'push' && needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Check for tap token
        id: token
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew update."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'

      - uses: actions/download-artifact@v8
        if: steps.token.outputs.present == 'true'
        with:
          name: hush-${{ needs.build.outputs.version }}
          path: dist

      - name: Fill formulae
        if: steps.token.outputs.present == 'true'
        env:
          SIGNED: ${{ needs.build.outputs.signed }}
        run: scripts/homebrew.sh "${{ needs.build.outputs.version }}" dist/SHA256SUMS.txt

      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Push to tap
        if: steps.token.outputs.present == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p tap/Casks tap/Formula
          cp packaging/homebrew/out/hush.rb tap/Casks/hush.rb
          cp packaging/homebrew/out/hush-cli.rb tap/Formula/hush-cli.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/hush.rb Formula/hush-cli.rb
          if git diff --cached --quiet; then
            echo "Tap already up to date."
          else
            git commit -m "hush $VERSION"
            git push
          fi
