name: Hush
options:
  bundleIdPrefix: fyi.hushpass
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

# AppStore is a Release build with APP_STORE defined: no direct paste (needs Accessibility,
# unavailable in the App Store sandbox) and no "Check for Updates" (the store updates it).
configs:
  Debug: debug
  Release: release
  AppStore: release

packages:
  HushCore:
    path: ../Core
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Hush:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - path: Hush
    dependencies:
      - package: HushCore
        product: HushCore
      - package: KeyboardShortcuts
    info:
      path: Hush/Info.plist
      properties:
        CFBundleDisplayName: Hush
        CFBundleName: Hush
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        # Only the system random number generator is used; no encryption to declare for export.
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 XuYi · GPL-3.0-or-later"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleAllowMixedLocalizations: true
        CFBundleURLTypes:
          - CFBundleURLName: fyi.hushpass.Hush
            CFBundleURLSchemes: [hush]
    entitlements:
      path: Hush/Hush.entitlements
      properties:
        # App Sandbox on, and deliberately NO com.apple.security.network.client:
        # Hush cannot reach the network.
        com.apple.security.app-sandbox: true
        # Only the file the user picks in an Open/Save panel (preset import and export).
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fyi.hushpass.Hush
        # Team used by Xcode Cloud and App Store signing. Local Debug/Release builds stay ad-hoc.
        DEVELOPMENT_TEAM: 9XAXTT7H29
        PRODUCT_NAME: Hush
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        # Distribution builds must not carry com.apple.security.get-task-allow (it lets a debugger,
        # or any same-user process, attach and read memory; notarization rejects it). `xcodebuild
        # build` injects it unless this is off; only Debug keeps it.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        AppStore:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_STORE
          # Signed with the Apple Distribution certificate when archiving for App Store Connect
          # (scripts/appstore.sh passes the team and identity).
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Distribution

schemes:
  Hush App Store:
    build:
      targets:
        Hush: all
    run:
      config: AppStore
    profile:
      config: AppStore
    analyze:
      config: AppStore
    archive:
      config: AppStore
