name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test HushCore
        run: swift test --package-path Core
      - name: Build CLI
        run: swift build -c release --product hush

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build app
        run: make app
